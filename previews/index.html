<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Arkenelle location background previews</title>
  <style>
    body { margin: 0; font-family: Segoe UI, sans-serif; background: #090c11; color: #f0f4fa; }
    main { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0 4rem; }
    h1 { font-weight: 500; }
    p { color: #b8c3d2; }
    figure { margin: 0 0 2.5rem; }
    img { width: 100%; height: auto; border-radius: 10px; border: 1px solid #334155; display: block; }
    figcaption { margin-top: 0.6rem; color: #e8c56a; }
  </style>
</head>
<body>
  <main>
    <h1>Location background previews</h1>
    <p>Local only — not on the live site. Dark overlay so wiki text stays readable.</p>
    <figure>
      <img src="loc-preview-fire-forge.png" alt="Fire Forge">
      <figcaption>Fire Forge — lava / forge</figcaption>
    </figure>
    <figure>
      <img src="loc-preview-fungus-domain.png" alt="Fungus Domain">
      <figcaption>Fungus Domain — mushroom dungeon</figcaption>
    </figure>
    <figure>
      <img src="loc-preview-castle-garden.png" alt="Castle Garden">
      <figcaption>Castle Garden — night fountain garden</figcaption>
    </figure>
    <figure>
      <img src="loc-preview-the-hollow.png" alt="The Hollow">
      <figcaption>The Hollow — empty lit pad</figcaption>
    </figure>
    <figure>
      <img src="loc-preview-all-26.png" alt="All 26 locations">
      <figcaption>All 26 — atmosphere tiles</figcaption>
    </figure>
  </main>
</body>
</html>
