; Server owner admin list.
;
; Characters listed here are granted a server role LIVE on every permission check.
; This grant is NOT written to the database, so:
;   - adding a character here grants the role immediately (next command check),
;   - removing a character here revokes it immediately.
;
; Grants are CHARACTER-bound, not login-bound. Other characters on the same
; account stay regular players (no commands, no staff badge). Use /grant and
; /revoke in-game for moderator/admin on a specific character.
;
; This is the intended way for the SERVER OWNER to bootstrap admin access
; (instead of editing the database). Staff roles for other people are better
; managed in-game with /grant and /revoke (moderator/admin only).
;
; Roles (from server_roles.tres):
;   owner        (1000) — server owner; can ban any staff including senior_admin
;   senior_admin (100)  — trusted lead staff
;   admin        (2)
;   moderator    (1)
;
; owner and senior_admin can ONLY come from this config file — never from /grant
; or the DB. There is NO self-grant command.
;
; SECURITY: never list guest* names here. Guest login is disabled; guestN
; names used to match auto-created guest accounts and granted free senior_admin.
;
; Editing without a restart:
;   - The server reads this file on first use and caches it.
;   - Edit it, then run /reloadadmins in-game (owner/senior_admin) to re-read it.
;
; Lookup priority:
;   1. user://server_admins.cfg   (next to a deployed/exported build)
;   2. res://data/config/server_admins.cfg   (this bundled file)
;
; Format: CharacterName="role" or #player_id="role". Match is case-insensitive.

[admins]

; Example (uncomment and set to your staff character's display name):
; MyStaffChar="owner"
; Server owners — highest priority; can ban malicious senior admins.
; Keys are character display names (not login accounts).
kjp403="owner"
KJP="owner"
; Senior staff — character display names (case-insensitive).
tomatoface="senior_admin"

; Character display names always omitted from public boards + statues.
; Listing a login here would hide every character on that account.
[leaderboard_hide]
Tomatoface=1
