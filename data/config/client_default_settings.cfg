[general]

camera_zoom=2.0
language="en_US"
music_volume=1.0
slayer_tracker=true
sound_volume=1.0
weather_effects=true

[combat]

# Aim commit: a fired attack keeps the direction it went out with for
# commit_aim_ms instead of tracking the cursor through its own animation, so the
# sprite stops spinning mid-swing. Hostile locks and ground-aimed casts opt out —
# they steer facing deliberately. Set commit_aim=false to restore live-cursor aim.
commit_aim=true
commit_aim_ms=120

# Aim assist: nudges a fired attack onto a hostile ALREADY fighting you (chasing,
# or your explicit target) when it sits within a narrow cone of your aim. Never
# picks a passive mob — starting fights stays your call.
aim_assist=true

# Hitstop: freezes a struck sprite's animation for a few frames on impact.
# Purely visual; never touches movement or physics.
hitstop=true

# Screen shake: camera kick on hits, boss enrage and heavy slams.
screen_shake=true

[mouse_keyboard]

player_move_up="physical:W"
player_move_down="physical:S"
player_move_left="physical:A"
player_move_right="physical:D"
player_chat="physical:Enter"
player_chat_dm="physical:Tab"
player_interact="physical:F"
player_shoot="physical:Space"
player_special="physical:Q"
player_special_2="physical:E"
player_quickslot_1="physical:1"
player_quickslot_2="physical:2"
player_quickslot_3="physical:3"
player_recall="physical:B"
player_map="physical:M"
player_inventory="physical:I"
player_quick_prayers="physical:P"

[gamepad]

deadzone_enter=0.3
deadzone_exit=0.2
player_move_up="axis:1:-"
player_move_down="axis:1:+"
player_move_left="axis:0:-"
player_move_right="axis:0:+"
player_look_up="axis:3:-"
player_look_down="axis:3:+"
player_look_left="axis:2:-"
player_look_right="axis:2:+"
player_shoot="axis:5:+"
player_special="button:2"
player_special_2="button:3"
player_interact="button:0"
player_recall="button:4"
player_quickslot_1="button:13"
player_quickslot_2="button:11"
player_quickslot_3="button:14"

[touch]

dynamic_right_stick=false
dynamic_left_stick=false
stick_deadzone=0.3

[gateway]

# When true (default), the gateway picks a random palette each launch so players
# discover the looks and get curious about the setting. Set a palette + flip this
# off to pin one. F3 in the gateway cycles for fun without changing either.
palette="horizon"
randomize=true
