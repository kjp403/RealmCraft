name: Deploy VPS

# After this is set up once (GitHub secrets + first merge), you never need to
# SSH for normal content updates. Push/merge to main → live world updates.
#
# Manual button: Actions → "Deploy VPS" → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets under: Repo → Settings → Secrets and variables → Actions"
            echo "See deploy/README.md (Auto-deploy section)."
            exit 1
          fi
          # Catch the common mistake: pasted .pub / wrong file / mangled key.
          # Do not print the secret — only check shape.
          if ! printf '%s' "$VPS_SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error::VPS_SSH_KEY does not look like a private key."
            echo "It must start with -----BEGIN OPENSSH PRIVATE KEY----- (or BEGIN RSA PRIVATE KEY)."
            echo "Do NOT use the .pub file. Re-copy with:"
            echo "  Get-Content \$env:USERPROFILE\\.ssh\\arkenelle_ovh -Raw | Set-Clipboard"
            exit 1
          fi
          echo "Secrets present and VPS_SSH_KEY looks like a private key."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Required when the private key was created with a passphrase.
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 15m
          request_pty: true
          script: |
            set -euo pipefail
            # Pull first so brand-new files (like deploy/update.sh) exist on the VPS
            # before we try to execute them. Then run the full update script.
            cd /opt/arkenelle
            sudo -u arkenelle git fetch --prune origin main
            sudo -u arkenelle git merge --ff-only origin/main
            sudo bash /opt/arkenelle/deploy/update.sh
