name: Deploy VPS

# After this is set up once (GitHub secrets + first merge), you never need to
# SSH for normal content updates. Push/merge to main → live world updates.
#
# Manual button: Actions → "Deploy VPS" → Run workflow
on:
  push:
    branches: [main]
    # A WEBSITE OR DOCS PUSH MUST NOT RESTART THE WORLD. deploy/update.sh always
    # ends in `systemctl restart arkenelle-master arkenelle-gateway
    # arkenelle-world`, so before this filter a CSS tweak disconnected every
    # player — and if it landed inside a Traveling Peddler window it took the
    # cart with it, because the cart is only re-placed once a player is standing
    # in its biome again. Cloudflare Pages builds website/ from the same push, so
    # the site still ships; only the VPS deploy is skipped.
    #
    # AN IGNORE LIST, NOT AN ALLOW LIST. Anything new defaults to deploying,
    # which is the safe direction to be wrong in — a missed deploy is a bug
    # report, a missed path in an allow list is a server silently running old
    # code. Only add a path here if it cannot change what the server runs.
    #
    # `.github/**` IS ON THE LIST ON PURPOSE, and it is what lets this filter
    # apply to its own arrival. A push event runs the workflow file as it exists
    # in the pushed commit, so the commit that adds these lines is already
    # filtered by them — a push carrying only website and workflow changes skips
    # the deploy instead of costing one last restart to install the fix. Nothing
    # under .github/ is read by deploy/update.sh or by any game service; it runs
    # on GitHub's runners only.
    paths-ignore:
      - "website/**"
      - ".github/**"
      - "previews/**"
      - "**/*.md"
  # Always available, and the way to force a deploy after a skipped push.
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets under: Repo → Settings → Secrets and variables → Actions"
            echo "See deploy/README.md (Auto-deploy section)."
            exit 1
          fi
          # Catch the common mistake: pasted .pub / wrong file / mangled key.
          # Do not print the secret — only check shape.
          if ! printf '%s' "$VPS_SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            echo "::error::VPS_SSH_KEY does not look like a private key."
            echo "It must start with -----BEGIN OPENSSH PRIVATE KEY----- (or BEGIN RSA PRIVATE KEY)."
            echo "Do NOT use the .pub file. Re-copy with:"
            echo "  Get-Content \$env:USERPROFILE\\.ssh\\arkenelle_ovh -Raw | Set-Clipboard"
            exit 1
          fi
          echo "Secrets present and VPS_SSH_KEY looks like a private key."

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Required when the private key was created with a passphrase.
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 15m
          request_pty: true
          script: |
            set -euo pipefail
            # Sync the VPS tree to origin/main before running update.sh.
            # Godot --import on prior deploys often dirties *.import files, which
            # would block a plain merge/ff-only pull.
            cd /opt/arkenelle
            sudo -u arkenelle git fetch --prune origin main
            sudo -u arkenelle git reset --hard origin/main
            # Never wipe Godot user:// (.local), caches, or the browser-client
            # docroot (root-owned files from publish-web-client.sh).
            sudo -u arkenelle git clean -fd -e .local -e .cache -e .config -e client-web -e client-windows
            sudo bash /opt/arkenelle/deploy/update.sh
