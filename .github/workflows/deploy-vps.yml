name: Deploy VPS

# After this is set up once (GitHub secrets + first merge), you never need to
# SSH for normal content updates. Push/merge to main → live world updates.
#
# Manual button: Actions → "Deploy VPS" → Run workflow
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets under: Repo → Settings → Secrets and variables → Actions"
            echo "See deploy/README.md (Auto-deploy section)."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script_stop: true
          # Inline bootstrap so the FIRST run works even before update.sh exists
          # on the VPS. After pull, prefer the repo script.
          script: |
            set -euo pipefail
            cd /opt/arkenelle
            if [ -f deploy/update.sh ]; then
              sudo bash deploy/update.sh
            else
              sudo -u arkenelle git fetch --prune origin main
              sudo -u arkenelle git merge --ff-only origin/main
              sudo -u arkenelle godot --headless --path /opt/arkenelle --import
              sudo systemctl restart arkenelle-master arkenelle-gateway arkenelle-world
              systemctl --no-pager --lines=0 status arkenelle-master arkenelle-gateway arkenelle-world || true
            fi
