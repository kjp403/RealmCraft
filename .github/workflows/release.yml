name: Release clients to itch.io

# Tag a release (e.g. `git tag v0.28.1 && git push origin v0.28.1`) → exports
# Windows / Linux / Web clients, pushes them to itch.io via butler (backup),
# copies the Web export to /opt/arkenelle/client-web, and copies the Windows
# portable zip + latest.json to /opt/arkenelle/client-windows
# (https://play.arkenelle.com/desktop/). Server deploy is a separate workflow
# (deploy-vps.yml) — this one never restarts the live world.
#
# Prerequisites (one-time): see deploy/release-clients.md
#   1. Create itch project https://kjp403.itch.io/arkenelle
#   2. Add GitHub secret BUTLER_API_KEY
#
# Android is opt-in: gated on ANDROID_KEYSTORE_BASE64. Until set, Win/Linux/Web
# ship and Android is skipped.
on:
  push:
    tags: ["v*"]
    # Auto-ship Windows + Web when application/config/version changes on main so
    # itch Library and play.arkenelle.com cannot lag the live server.
    branches: [main]
    paths: ["project.godot"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platform(s) to export + push"
        type: choice
        default: all
        options: [all, windows, linux, web, android]

env:
  # Must match project.godot features / the editor you develop with.
  GODOT_REF: "4.7.1-stable"
  GODOT_VERSION_DIR: "4.7.1.stable"
  ITCH_GAME: "kjp403/arkenelle"

jobs:
  # Skip main-branch runs that touched project.godot without bumping config/version
  # (icons, features, min_client_version-only edits, etc.).
  gate:
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      platforms: ${{ steps.decide.outputs.platforms }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Decide whether to release
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "platforms=${{ github.event.inputs.platforms }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "platforms=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # push to main (project.godot path filter already applied)
          curr="$(grep -E '^config/version=' project.godot | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          prev="$(git show HEAD^:project.godot 2>/dev/null | grep -E '^config/version=' | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || true)"
          echo "Version before='${prev:-}' after='${curr}'"
          if [ -n "$curr" ] && [ "$curr" != "$prev" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            # Windows (itch Library) + Web (play.arkenelle.com).
            echo "platforms=windows,web" >> "$GITHUB_OUTPUT"
          else
            echo "config/version unchanged — skipping client release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "platforms=windows" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve target platforms
        run: |
          P="${{ needs.gate.outputs.platforms }}"
          echo "PLATFORMS=${P:-all}" >> "$GITHUB_ENV"
          echo "Target platforms: ${P:-all}"

      - name: Optional butler (itch backup)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "::notice::BUTLER_API_KEY unset — skipping itch push. Self-hosted Windows/Web still publish to the VPS."
            echo "HAS_BUTLER=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "HAS_BUTLER=true" >> "$GITHUB_ENV"

      - name: Info - server-class references in client-shipped code
        run: |
          set -euo pipefail
          # Naming server classes in common//client/ is supported — stubs are
          # injected at export time by addons/tinymmo/export_plugin.
          CLASSES=$(grep -rh '^class_name ' source/server/ --include='*.gd' | sed 's/^class_name \([A-Za-z0-9_]*\).*/\1/' | sort -u | paste -sd'|')
          echo "Server-only classes: $CLASSES"
          grep -rEn "^[^#]*\b($CLASSES)\b" source/common/ source/client/ --include='*.gd' \
            && echo "::notice::The references above rely on the server-class stub export plugin." \
            || echo "No server-class references in client-shipped code."

      - name: Detect Android config
        id: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Android keystore configured — Android will build + ship."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — Android skipped (Win/Linux/Web unaffected)."
          fi

      - name: Fetch headless Godot editor ${{ env.GODOT_REF }}
        run: |
          set -euo pipefail
          curl -fL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_REF}/Godot_v${GODOT_REF}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_REF}_linux.x86_64" godot
          chmod +x godot
          ./godot --headless --version

      - name: Install official export templates
        env:
          HAS_ANDROID: ${{ steps.android.outputs.enabled }}
        run: |
          set -euo pipefail
          # Official templates match the editor ABI. (Optional slim custom templates
          # from build-templates.yml can replace these later for smaller downloads.)
          curl -fL -o export_templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_REF}/Godot_v${GODOT_REF}_export_templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/${GODOT_VERSION_DIR}"
          mkdir -p "$DEST"
          unzip -q export_templates.tpz -d tpl_extract
          # .tpz unpacks to templates/*
          cp -a tpl_extract/templates/. "$DEST/"
          echo "${GODOT_VERSION_DIR}" > "$DEST/version.txt"
          ls -lah "$DEST" | head -40
          test -f "$DEST/windows_release_x86_64.exe"
          test -f "$DEST/linux_release.x86_64"
          test -f "$DEST/web_nothreads_release.zip" || test -f "$DEST/web_release.zip"
          if [ "$HAS_ANDROID" = "true" ]; then
            test -f "$DEST/android_release.apk"
          fi

      # ---- Android toolchain (only when the keystore secret is configured) ----

      - name: Set up JDK 17 (Android signing/export)
        if: steps.android.outputs.enabled == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (apksigner + zipalign)
        if: steps.android.outputs.enabled == 'true'
        run: |
          set -eo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;36.1.0" "platforms;android-36"

      - name: Point Godot at the Android SDK + JDK (headless editor settings)
        if: steps.android.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Decode release keystore
        if: steps.android.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "Wrote keystore ($(stat -c%s "$RUNNER_TEMP/release.keystore") bytes)"

      # ------------------------------------------------------------------------

      - name: Import project (warm the .godot cache)
        run: |
          # Cold-start import first — exporting on a fresh checkout otherwise
          # can segfault (Godot 4 CLI quirk).
          ./godot --headless --path . --import || true

      - name: Export clients
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          want() { case ",${PLATFORMS}," in *,all,*|*,$1,*) return 0 ;; esac; return 1; }
          mkdir -p exports/windows exports/linux exports/web exports/android
          if want windows; then
            ./godot --headless --path . --export-release "Windows" exports/windows/Arkenelle.exe
          fi
          if want linux; then
            ./godot --headless --path . --export-release "Linux" exports/linux/Arkenelle.x86_64
            chmod +x exports/linux/Arkenelle.x86_64
          fi
          if want web; then
            ./godot --headless --path . --export-release "Web" exports/web/index.html
          fi
          if want android; then
            if [ -f "$RUNNER_TEMP/release.keystore" ]; then
              ./godot --headless --path . --export-release "Android" exports/android/Arkenelle.apk
            else
              echo "Android selected but keystore not configured — skipping."
            fi
          fi
          echo "---- exported ($PLATFORMS) ----"
          du -sh exports/windows exports/linux exports/web exports/android 2>/dev/null || true

      - name: Install butler
        if: env.HAS_BUTLER == 'true'
        run: |
          set -euo pipefail
          curl -fL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

      - name: Prepare portable itch builds
        run: |
          set -euo pipefail
          # Portable folders (exe + .pck, not one giant embedded exe) patch cleanly
          # in the itch app. Single-file Godot builds force full re-downloads and
          # often make "Update" fall back to a browser Download button.
          VERSION=$(grep -E '^config/version=' project.godot | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "USERVERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Game version: ${VERSION}"
          if [ -f exports/windows/Arkenelle.exe ]; then
            test -f exports/windows/Arkenelle.pck
            printf '%s\n' \
              '[[actions]]' \
              'name = "play"' \
              'path = "Arkenelle.exe"' \
              'platform = "windows"' \
              > exports/windows/.itch.toml
            ls -lah exports/windows
          fi
          if [ -f exports/linux/Arkenelle.x86_64 ]; then
            if [ ! -f exports/linux/Arkenelle.x86_64.pck ] && [ ! -f exports/linux/Arkenelle.pck ]; then
              echo "::warning::Linux .pck missing — export may still be embedded."
            fi
            printf '%s\n' \
              '[[actions]]' \
              'name = "play"' \
              'path = "Arkenelle.x86_64"' \
              'platform = "linux"' \
              > exports/linux/.itch.toml
          fi

      - name: Push clients to itch.io
        if: env.HAS_BUTLER == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          want() { case ",${PLATFORMS}," in *,all,*|*,$1,*) return 0 ;; esac; return 1; }
          # --userversion lets the itch app show 0.28.x and pick the right patch.
          if want windows; then
            ./butler push exports/windows "${ITCH_GAME}:windows" --userversion "${USERVERSION}"
          fi
          if want linux; then
            ./butler push exports/linux "${ITCH_GAME}:linux" --userversion "${USERVERSION}"
          fi
          if want web; then
            ./butler push exports/web "${ITCH_GAME}:web" --userversion "${USERVERSION}"
          fi
          if want android && [ -f exports/android/Arkenelle.apk ]; then
            # Push only the .apk, NOT the whole dir — Godot also drops an
            # Arkenelle.apk.idsig that sideloaders don't need.
            ./butler push exports/android/Arkenelle.apk "${ITCH_GAME}:android" --userversion "${USERVERSION}"
          fi

      - name: Pack Windows client for the VPS
        if: hashFiles('exports/windows/Arkenelle.exe') != ''
        env:
          USERVERSION: ${{ env.USERVERSION }}
        run: |
          set -euo pipefail
          VERSION="${USERVERSION:-$(grep -E '^config/version=' project.godot | head -1 | sed -E 's/.*"([^"]+)".*/\1/')}"
          export VERSION
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          src = Path("exports/windows")
          out_dir = Path("dist-win")
          out_dir.mkdir(exist_ok=True)
          zip_path = out_dir / "Arkenelle-windows.zip"
          skip_names = {".itch.toml"}
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_STORED) as zf:
              for p in src.rglob("*"):
                  if not p.is_file():
                      continue
                  if p.name in skip_names or p.name.endswith("console.exe"):
                      continue
                  zf.write(p, p.relative_to(src).as_posix())
          digest = hashlib.sha256()
          with zip_path.open("rb") as fh:
              while True:
                  chunk = fh.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
          sha = digest.hexdigest()
          payload = {
              "version": os.environ["VERSION"],
              "sha256": sha,
              "size": zip_path.stat().st_size,
              "url": "https://play.arkenelle.com/desktop/Arkenelle-windows.zip",
          }
          (out_dir / "latest.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print(f"Windows zip {payload['size']} bytes sha256={sha} version={payload['version']}")
          PY
          tar -C dist-win -czf arkenelle-windows-client.tar.gz Arkenelle-windows.zip latest.json
          cat dist-win/latest.json

      - name: Upload Windows client tarball to the VPS
        if: hashFiles('arkenelle-windows-client.tar.gz') != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: arkenelle-windows-client.tar.gz
          target: /tmp
          overwrite: true

      - name: Publish Windows client on play.arkenelle.com/desktop
        if: hashFiles('arkenelle-windows-client.tar.gz') != ''
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            TAR=/tmp/arkenelle-windows-client.tar.gz
            if [[ -f /opt/arkenelle/deploy/publish-windows-client.sh ]]; then
              sudo bash /opt/arkenelle/deploy/publish-windows-client.sh "$TAR"
            else
              DEST=/opt/arkenelle/client-windows
              STAGE=${DEST}.new
              sudo rm -rf "$STAGE"
              sudo mkdir -p "$STAGE"
              sudo tar -xzf "$TAR" -C "$STAGE"
              sudo rm -rf "$DEST"
              sudo mv "$STAGE" "$DEST"
              sudo chown -R arkenelle:arkenelle "$DEST"
              sudo chmod -R a+rX "$DEST"
              rm -f "$TAR"
            fi

      - name: Pack web client for the VPS
        if: hashFiles('exports/web/index.html') != ''
        run: tar -C exports/web -czf arkenelle-web-client.tar.gz .

      - name: Upload web client tarball to the VPS
        if: hashFiles('arkenelle-web-client.tar.gz') != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: arkenelle-web-client.tar.gz
          target: /tmp
          overwrite: true

      - name: Publish web client on play.arkenelle.com
        if: hashFiles('arkenelle-web-client.tar.gz') != ''
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          command_timeout: 5m
          script: |
            set -euo pipefail
            TAR=/tmp/arkenelle-web-client.tar.gz
            if [[ -f /opt/arkenelle/deploy/publish-web-client.sh ]]; then
              sudo bash /opt/arkenelle/deploy/publish-web-client.sh "$TAR"
            else
              DEST=/opt/arkenelle/client-web
              STAGE=${DEST}.new
              sudo rm -rf "$STAGE"
              sudo mkdir -p "$STAGE"
              sudo tar -xzf "$TAR" -C "$STAGE"
              sudo rm -rf "$DEST"
              sudo mv "$STAGE" "$DEST"
              sudo chown -R arkenelle:arkenelle "$DEST"
              sudo chmod -R a+rX "$DEST"
              rm -f "$TAR"
            fi

      - name: Verify itch channel userversions
        if: env.HAS_BUTLER == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          want() { case ",${PLATFORMS}," in *,all,*|*,$1,*) return 0 ;; esac; return 1; }
          # butler finishes "processing" a few seconds after push; poll until the
          # channel reports our --userversion so Library Update can find it.
          wait_channel() {
            local channel="$1"
            local i
            for i in $(seq 1 36); do
              local status
              status="$(./butler status "${ITCH_GAME}:${channel}" 2>&1 || true)"
              echo "$status"
              if echo "$status" | grep -Eq "[[:space:]]${USERVERSION}[[:space:]]*$|[[:space:]]${USERVERSION}$"; then
                echo "OK ${channel} -> ${USERVERSION}"
                return 0
              fi
              # Also accept VERSION column match anywhere on a windows/linux row.
              if echo "$status" | grep -F "${USERVERSION}" >/dev/null; then
                echo "OK ${channel} mentions ${USERVERSION}"
                return 0
              fi
              sleep 5
            done
            echo "::error::Channel ${channel} never showed userversion ${USERVERSION}"
            ./butler status "${ITCH_GAME}" || true
            return 1
          }
          if want windows; then wait_channel windows; fi
          if want linux; then wait_channel linux; fi
          if want web; then wait_channel web; fi
          ./butler status "${ITCH_GAME}"
