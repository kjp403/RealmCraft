name: Premium secrets

# Sets the premium-currency secrets on the VPS without anyone opening a
# terminal. Actions → "Premium secrets" → Run workflow.
#
# WHY THIS EXISTS. Everything else about premium currency deploys itself: the
# Deploy VPS workflow installs the Caddyfile and the systemd units on every push
# to main. The only things it cannot carry are the SECRETS, because a secret must
# never be in the repo - and collecting those was the one step that still needed
# an SSH session.
#
# It runs deploy/deploy_premium.sh --from-env, the SAME script as the interactive
# path. Two ways to configure a box with different behaviour is how one ends up
# in a state nobody can reproduce.
#
# MANUAL ONLY. Never on push: this restarts the master and the gateway, and a
# code push has no business doing that as a side effect.

on:
  workflow_dispatch:
    inputs:
      restart_world:
        description: "Also restart the world (DISCONNECTS EVERYONE ONLINE)"
        type: boolean
        default: false

concurrency:
  # Shares a group with the deploy workflow: both write to the same box and both
  # restart services, so they must never overlap.
  group: deploy-vps
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY STRIPE_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          # Shape check only - never print the value. whsec_ is the ENDPOINT
          # SIGNING SECRET from Developers → Webhooks, not the sk_live_ API key,
          # and pasting the wrong one fails every signature check at runtime
          # rather than here, where it would be obvious.
          case "$STRIPE_WEBHOOK_SECRET" in
            whsec_*) ;;
            "") ;;
            *) echo "::error::STRIPE_WEBHOOK_SECRET must start with whsec_ (endpoint signing secret, not an API key)."; missing=1 ;;
          esac
          if [ "$missing" -ne 0 ]; then
            echo "Add secrets under: Repo → Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Secrets present and the Stripe secret has the right shape."

      - name: Configure over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          RESTART_WORLD: ${{ inputs.restart_world && 'y' || 'n' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 8m
          request_pty: true
          # Passed through to the remote shell. GitHub masks the value in the
          # log, and the script only ever reports its length.
          envs: STRIPE_WEBHOOK_SECRET,RESTART_WORLD
          script: |
            set -euo pipefail
            cd /opt/arkenelle
            sudo -u arkenelle git fetch --prune origin main
            # `sudo env` rather than `sudo VAR=...`: sudo resets the environment,
            # so the assignment has to be made by env inside the new one.
            sudo env \
              ARKENELLE_STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
              RESTART_WORLD="${RESTART_WORLD:-n}" \
              bash /opt/arkenelle/deploy/deploy_premium.sh --from-env
