name: Investigate Players

# One-shot VPS lookup for account/character intel. Does NOT restart services.
on:
  push:
    branches: [cursor/investigate-players-6dc0]
  workflow_dispatch:
    inputs:
      accounts:
        description: "Comma-separated account or display names"
        required: true
        default: "Nesato,qqqqq"

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query VPS player data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          command_timeout: 5m
          request_pty: true
          script: |
            set -euo pipefail
            ACCOUNTS="Nesato,qqqqq"
            OUT=/tmp/arkenelle-player-lookup-latest.txt
            exec > >(tee "$OUT") 2>&1
            echo "=== Arkenelle player lookup @ $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
            echo "Query: $ACCOUNTS"
            echo
            echo "== service user =="
            getent passwd arkenelle || true
            echo
            echo "== installing sqlite3 if needed =="
            if ! command -v sqlite3 >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y sqlite3
            fi
            if ! command -v rg >/dev/null 2>&1; then
              sudo apt-get install -y ripgrep || true
            fi
            echo
            echo "== candidate userdata / db files =="
            find /opt/arkenelle /home/arkenelle /var/lib/arkenelle -type f \( -name 'classic.db' -o -name 'account_collection.tres' -o -name 'server_bans.cfg' -o -name 'server_jail.cfg' -o -name 'server_mutes.cfg' -o -name 'server_admins.cfg' \) 2>/dev/null | sort -u
            echo
            DB="$(find /opt/arkenelle /home/arkenelle /var/lib/arkenelle -name 'classic.db' 2>/dev/null | head -1 || true)"
            echo "DB=$DB"
            echo
            if [ -z "$DB" ]; then
              echo "ERROR: classic.db not found"
              exit 1
            fi
            IFS=',' read -ra NAMES <<< "$ACCOUNTS"
            for raw in "${NAMES[@]}"; do
              name="$(echo "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^@//')"
              [ -z "$name" ] && continue
              echo "######## PLAYER MATCH: $name ########"
              sqlite3 -header -column "$DB" "SELECT player_id, account_name, display_name, level, experience, available_attributes_points, skin_id, active_guild_id, led_guild_id, server_roles_json, profile_status FROM players WHERE account_name LIKE '%' || '$name' || '%' COLLATE NOCASE OR display_name LIKE '%' || '$name' || '%' COLLATE NOCASE;"
              echo
              echo "-- full JSON blobs --"
              sqlite3 "$DB" "SELECT json_object('player_id', player_id, 'account_name', account_name, 'display_name', display_name, 'level', level, 'experience', experience, 'available_attributes_points', available_attributes_points, 'skin_id', skin_id, 'active_guild_id', active_guild_id, 'led_guild_id', led_guild_id, 'attributes_json', attributes_json, 'inventory_json', inventory_json, 'bank_json', bank_json, 'equipment_json', equipment_json, 'skills_json', skills_json, 'mastery_json', mastery_json, 'quests_json', quests_json, 'friends_json', friends_json, 'blocked_ids_json', blocked_ids_json, 'owned_skins_json', owned_skins_json, 'server_roles_json', server_roles_json, 'stats_json', stats_json, 'titles_json', titles_json, 'dailies_json', dailies_json, 'dungeon_lockouts_json', dungeon_lockouts_json, 'redeemed_codes_json', redeemed_codes_json, 'wardstones_json', wardstones_json, 'joined_guild_ids_json', joined_guild_ids_json) FROM players WHERE account_name LIKE '%' || '$name' || '%' COLLATE NOCASE OR display_name LIKE '%' || '$name' || '%' COLLATE NOCASE;"
              echo
              echo "-- guild membership --"
              sqlite3 -header -column "$DB" "SELECT gm.player_id, p.account_name, p.display_name, gm.guild_id, g.name AS guild_name, gm.rank FROM guild_members gm LEFT JOIN players p ON p.player_id = gm.player_id LEFT JOIN guilds g ON g.guild_id = gm.guild_id WHERE p.account_name LIKE '%' || '$name' || '%' COLLATE NOCASE OR p.display_name LIKE '%' || '$name' || '%' COLLATE NOCASE;" 2>/dev/null || true
              echo
              echo "-- recent chat messages --"
              sqlite3 -header -column "$DB" "SELECT * FROM messages WHERE sender_name LIKE '%' || '$name' || '%' COLLATE NOCASE OR CAST(text AS TEXT) LIKE '%' || '$name' || '%' COLLATE NOCASE ORDER BY rowid DESC LIMIT 50;" 2>/dev/null || true
              echo
              echo "-- mail --"
              sqlite3 -header -column "$DB" "SELECT * FROM mail WHERE CAST(mail AS TEXT) LIKE '%' || '$name' || '%' COLLATE NOCASE OR CAST(to_player_id AS TEXT) IN (SELECT CAST(player_id AS TEXT) FROM players WHERE account_name LIKE '%' || '$name' || '%' COLLATE NOCASE OR display_name LIKE '%' || '$name' || '%' COLLATE NOCASE) LIMIT 50;" 2>/dev/null || sqlite3 -header -column "$DB" "PRAGMA table_info(mail);" 2>/dev/null || true
              echo
            done
            echo "######## ALL STAFF / ROLES IN DB ########"
            sqlite3 -header -column "$DB" "SELECT player_id, account_name, display_name, level, server_roles_json FROM players WHERE server_roles_json IS NOT NULL AND server_roles_json NOT IN ('{}', '') ORDER BY account_name;"
            echo
            echo "######## BANS / JAIL / MUTES / ADMIN CFG ########"
            for cfg in server_bans.cfg server_jail.cfg server_mutes.cfg server_admins.cfg; do
              echo "-- $cfg --"
              find /opt/arkenelle /home/arkenelle -name "$cfg" 2>/dev/null | while read -r f; do
                echo "FILE $f"
                sed -n '1,300p' "$f" || true
              done
            done
            echo
            echo "######## MASTER ACCOUNT COLLECTION MATCHES ########"
            find /opt/arkenelle /home/arkenelle -name 'account_collection.tres' 2>/dev/null | while read -r f; do
              echo "FILE $f"
              for raw in "${NAMES[@]}"; do
                name="$(echo "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^@//')"
                echo "--- matches for $name ---"
                if command -v rg >/dev/null 2>&1; then
                  rg -i -n -C 8 "$name" "$f" || echo "(no match)"
                else
                  grep -i -n -C 8 "$name" "$f" || echo "(no match)"
                fi
              done
            done
            echo
            echo "######## RECENT SERVER LOG MENTIONS ########"
            find /opt/arkenelle /home/arkenelle -path '*/logs/*.log' 2>/dev/null | sort | tail -8 | while read -r log; do
              echo "LOG $log"
              for raw in "${NAMES[@]}"; do
                name="$(echo "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//;s/^@//')"
                if command -v rg >/dev/null 2>&1; then
                  rg -i -n --max-count 40 "$name" "$log" || true
                else
                  grep -i -n "$name" "$log" | head -40 || true
                fi
              done
            done
            echo
            echo "=== END ==="
            wc -l "$OUT"

      - name: Fetch lookup file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          source: /tmp/arkenelle-player-lookup-latest.txt
          target: lookup-out/
          strip_components: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: player-lookup
          path: lookup-out/
          retention-days: 7
