; PRODUCTION world config for the VPS. Passed to the world server with
;   --config=res://deploy/config/world_config.cfg
; The ONLY change from data/config/world_config.cfg is public_url: the gateway
; hands this URL to clients so they know where to connect for gameplay. Behind
; Caddy it must be the public wss:// address, NOT 127.0.0.1.

[world-server]
port=8087
bind_address="127.0.0.1"
certificate_path="res://data/config/tls/certificate.crt"
key_path="res://data/config/tls/key.key"
database_path="."
motd="WELCOME_TINY_MMO"
name="Classic"
max_players=200
hardcore=false
bonus_xp=0.0
max_character=5
pvp=false
public_url="wss://play.arkenelle.com"

[world-manager-client]
address="127.0.0.1"
port=8062
certificate_path="res://data/config/tls/certificate.crt"
